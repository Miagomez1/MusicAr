
services:
  catalogo-service:
    build:
      context: .
      dockerfile: ./MusicAr.CatalogService/Dockerfile
    ports:
      - "5184:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "${CATALOGO_DB_CONNECTION}"
    networks:
      - musicar-net

  api-gateway:
    build:
      context: .
      dockerfile: ./MusicAr.ApiGateway/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
    depends_on:
      - catalogo-service
    networks:
      - musicar-net

networks:
  musicar-net:
    driver: bridge
